<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcriber — Live Transcript</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

        html { scroll-behavior: smooth; }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Inter", sans-serif;
            background: #ffffff;
            color: #202020;
            display: flex;
            flex-direction: column;
            height: 100vh;
            accent-color: #000000;
        }

        /* ── Header ── */
        .header {
            background: #ffffff;
            padding: 14px 16px;
            border-bottom: 1px solid #dddddd;
            flex-shrink: 0;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-size: 13px;
            font-weight: 700;
            color: #111111;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .header-brand {
            font-size: 10px;
            color: #707070;
            margin-top: 2px;
        }

        /* ── Transcript area ── */
        #transcript-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #ffffff;
        }

        .transcript-block {
            margin-bottom: 18px;
            padding: 10px 12px;
            background: #f7f7f7;
            border-radius: 8px;
            border-left: 2px solid #d0d0d0;
            transition: border-color 0.2s;
        }

        .transcript-block:hover { border-left-color: #777; }

        .block-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .speaker-name {
            font-size: 11px;
            font-weight: 600;
            color: #111111;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .block-time {
            font-size: 10px;
            color: #707070;
        }

        .block-text {
            font-size: 13px;
            line-height: 1.55;
            color: #202020;
            word-break: break-word;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cccccc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #999999; }

        /* ── Empty state ── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #707070;
            font-size: 13px;
            gap: 8px;
        }

        .empty-state svg { opacity: 0.3; }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-top">
            <div>
                <div class="header-title" id="meeting-title">Live Transcript</div>
                <div class="header-brand">Transcriber &middot; Byte by Byte</div>
            </div>
        </div>
    </div>

    <div id="transcript-container"></div>

    <script src="side-panel.js"></script>
</body>

</html>
